name: Deploy retirement page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 退役版: アプリはビルドせず、pages-retire/ の静的ページだけを公開する。
  # localStorage の shotmachine.apiKey / shotmachine.elevenLabsKey を削除して新URLへ誘導する。
  # ⚠️ main へマージ（または main で workflow_dispatch）すると公開される。PM承認後のみ。
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site
          cp pages-retire/index.html pages-retire/retire.js pages-retire/retire.css site/
          cp site/index.html site/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
