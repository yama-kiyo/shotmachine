name: Test & Deploy retirement page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  # GitHub Pages 退役版: アプリはビルド・公開しない。pages-retire/ の静的ページだけを Pages に公開する
  # （localStorage の shotmachine.apiKey / shotmachine.elevenLabsKey を削除し、新URLへ誘導）。
  # アプリ本体の公開は Vercel（vercel.json・npm run build → dist/ のみ）。pages-retire/ は dist に入らない。
  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-retire
      - id: deployment
        uses: actions/deploy-pages@v4
